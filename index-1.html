<style>
:root{--p:#4B1D8F;--pd:#2A0F55;--y:#FFC93C;--bg:#F6F1FF;--card:#fff;--tx:#241338;--mu:#6b5c82;--ln:#ddd0f2;--ac:#4B1D8F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0d33;--card:#2a1650;--tx:#f3ecff;--mu:#b9a8d6;--ln:#47296f;--ac:#FFC93C}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{overflow-x:hidden;margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--pd);color:#fff;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;font-weight:800;font-size:24px;letter-spacing:3px;color:#fff;cursor:pointer}
.logo img{height:40px;width:auto}
.hlogo{width:fit-content;display:flex;align-items:center;gap:14px;direction:ltr;margin-bottom:18px}
.hlogo img{height:88px;width:auto;filter:drop-shadow(0 6px 18px #0007)}
.hlogo b{display:block;font-size:46px;letter-spacing:7px;line-height:1}
.hlogo small{color:var(--y);font-weight:500;letter-spacing:3px;text-transform:uppercase;font-size:13px}
.panel.brand::before{content:"";display:block;height:70px;background:var(--logo) center/contain no-repeat;margin-bottom:10px}

function pickPhotos(inp){
  var fs=[].slice.call(inp.files||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name)});

  (function next(i){
    if(i>=q.length){if(inp.tagName)inp.value="";if(er.textContent===t("wait"))er.textContent="";thumbs();return}
    function skip(){er.textContent=t("eImg");next(i+1)}
    var fr=new FileReader();fr.onerror=skip;
    fr.onload=function(){var im=new Image();im.onerror=skip;
      im.onload=function(){try{var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend.push(c.toDataURL("image/jpeg",.65))}catch(e){er.textContent=t("eImg")}next(i+1)};
      im.src=fr.result};
    fr.readAsDataURL(q[i])})(0);
}
